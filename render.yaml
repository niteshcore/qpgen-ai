# Render Blueprint: one web service that serves both the Flask API and the static frontend.
# Create it from the Render dashboard: New > Blueprint > pick this repo.
services:
  - type: web
    name: qpgen
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn wsgi:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false        # paste your Supabase connection string in the dashboard
      - key: GOOGLE_API_KEY
        sync: false        # paste your Gemini key in the dashboard
